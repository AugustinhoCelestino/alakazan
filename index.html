<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Compartilhamento de tela peer-to-peer simples e seguro. Sem conta, sem servidor central, apenas P2P puro.">
    <meta name="theme-color" content="#10b981">
    <title>P2P Screen Share - Compartilhamento de Tela P2P</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🖥️ P2P Screen Share</h1>
            <p>Compartilhamento de tela peer-to-peer simples e seguro</p>
        </header>

        <main>
            <!-- Área de Conexão -->
            <div class="section" id="connectionSection">
                <h2>Conectar</h2>
                <div class="button-group">
                    <button id="startShareBtn" class="btn btn-primary">
                        🔴 Iniciar Compartilhamento
                    </button>
                    <button id="joinBtn" class="btn btn-secondary">
                        👁️ Assistir Compartilhamento
                    </button>
                </div>
            </div>

            <!-- Área de Compartilhamento -->
            <div class="section" id="shareSection" style="display: none;">
                <h2>Compartilhando sua Tela</h2>
                <div class="share-info">
                    <p>Compartilhe este código com alguém:</p>
                    <div class="code-display">
                        <span id="shareCode" class="code">Gerando...</span>
                        <button id="copyCodeBtn" class="btn btn-small">📋 Copiar</button>
                    </div>
                    <div class="qr-container" id="qrContainer"></div>
                </div>
                <button id="stopShareBtn" class="btn btn-danger">🛑 Parar Compartilhamento</button>
            </div>

            <!-- Área de Visualização -->
            <div class="section" id="viewSection" style="display: none;">
                <h2>Visualizar Tela Compartilhada</h2>
                <div class="input-group">
                    <input 
                        type="text" 
                        id="joinCode" 
                        placeholder="Cole o código aqui..." 
                        maxlength="8"
                    >
                    <button id="connectBtn" class="btn btn-primary">Conectar</button>
                    <button id="cancelJoinBtn" class="btn btn-secondary">Cancelar</button>
                </div>
                <div id="connectionStatus" class="status"></div>
            </div>

            <!-- Área de Vídeo -->
            <div class="video-container">
                <video id="remoteVideo" playsinline></video>
                <div id="statsOverlay" class="stats-overlay" style="display: none;">
                    <div id="statsContent"></div>
                </div>
            </div>
        </main>

        <footer>
            <p>Baseado em tecnologias P2P WebRTC • Sem servidor central • Privado & Seguro</p>
            <p>
                <a href="https://github.com" target="_blank">GitHub</a> • 
                <a href="#" onclick="toggleStats()">Mostrar Estatísticas</a>
            </p>
        </footer>
    </div>

    <script src="app.js?v=3.0"></script>
</body>
</html>
