<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Compartilhamento de tela peer-to-peer simples e seguro. Sem conta, sem servidor central, apenas P2P puro.">
    <meta name="theme-color" content="#10b981">
    <title>P2P Screen Share - Compartilhamento de Tela P2P</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🖥️ P2P Screen Share</h1>
            <p>Compartilhamento de tela peer-to-peer simples e seguro</p>
        </header>

        <main>
            <!-- Área de Conexão -->
            <div class="section" id="connectionSection">
                <h2>Conectar</h2>
                <div class="button-group">
                    <button id="startShareBtn" class="btn btn-primary">
                        🔴 Iniciar Compartilhamento
                    </button>
                    <button id="joinBtn" class="btn btn-secondary">
                        👁️ Assistir Compartilhamento
                    </button>
                </div>
            </div>

            <!-- Área de Compartilhamento -->
            <div class="section" id="shareSection" style="display: none;">
                <h2>Compartilhando sua Tela</h2>
                <div class="share-info">
                    <p>Compartilhe este código com alguém:</p>
                    <div class="code-display">
                        <span id="shareCode" class="code">Gerando...</span>
                        <button id="copyCodeBtn" class="btn btn-small">📋 Copiar</button>
                    </div>
                    <div class="qr-container" id="qrContainer"></div>
                </div>
                <button id="stopShareBtn" class="btn btn-danger">🛑 Parar Compartilhamento</button>
            </div>

            <!-- Área de Visualização -->
            <div class="section" id="viewSection" style="display: none;">
                <h2>Visualizar Tela Compartilhada</h2>
                <div class="input-group">
                    <input 
                        type="text" 
                        id="joinCode" 
                        placeholder="Cole o código aqui..." 
                        maxlength="8"
                    >
                    <button id="connectBtn" class="btn btn-primary">Conectar</button>
                    <button id="cancelJoinBtn" class="btn btn-secondary">Cancelar</button>
                </div>
                <div id="connectionStatus" class="status"></div>
            </div>

            <!-- Área de Vídeo -->
            <div class="video-container">
                <video id="remoteVideo" playsinline></video>
                <div id="statsOverlay" class="stats-overlay" style="display: none;">
                    <div id="statsContent"></div>
                </div>
            </div>
        </main>

        <footer>
            <p>Baseado em tecnologias P2P WebRTC • Sem servidor central • Privado & Seguro</p>
            <p>
                <a href="https://github.com" target="_blank">GitHub</a> • 
                <a href="#" onclick="toggleStats()">Mostrar Estatísticas</a>
            </p>
        </footer>
    </div>

    <script>
        // =======================
        // P2P Screen Share - JavaScript Inline
        // =======================
        console.log('✅ P2P Screen Share v3.0 LOADED - Script Inline');

        class P2PScreenShare {
            constructor() {
                this.peerConnection = null;
                this.screenStream = null;
                this.isSharing = false;
                this.shareCode = null;
                this.iceServers = [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun3.l.google.com:19302' },
                    { urls: 'stun:stun4.l.google.com:19302' }
                ];
                this.initializeUI();
                this.checkUrlParams();
            }

            initializeUI() {
                document.getElementById('startShareBtn').addEventListener('click', () => this.startSharing());
                document.getElementById('joinBtn').addEventListener('click', () => this.showJoinSection());
                document.getElementById('stopShareBtn').addEventListener('click', () => this.stopSharing());
                document.getElementById('connectBtn').addEventListener('click', () => this.connectToShare());
                document.getElementById('cancelJoinBtn').addEventListener('click', () => this.cancelJoin());
                document.getElementById('copyCodeBtn').addEventListener('click', () => this.copyShareCode());
            }

            generateShareCode() {
                const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let code = '';
                for (let i = 0; i < 8; i++) {
                    code += characters.charAt(Math.floor(Math.random() * characters.length));
                }
                return code;
            }

            async startSharing() {
                try {
                    this.shareCode = this.generateShareCode();
                    document.getElementById('shareCode').textContent = this.shareCode;
                    
                    // Gerar QR Code via API
                    this.generateQRCode(this.shareCode);

                    try {
                        this.screenStream = await navigator.mediaDevices.getDisplayMedia({
                            video: { cursor: 'always' },
                            audio: false
                        });

                        this.isSharing = true;
                        document.getElementById('connectionSection').style.display = 'none';
                        document.getElementById('shareSection').style.display = 'block';
                        document.getElementById('viewSection').style.display = 'none';

                        this.screenStream.getTracks()[0].addEventListener('ended', () => {
                            if (this.isSharing) this.stopSharing();
                        });

                        await this.setupWebRTC(true);
                        this.storeShareCode(this.shareCode);

                    } catch (err) {
                        this.showStatus('Erro ao capturar tela: ' + err.message, 'error', true);
                    }
                } catch (err) {
                    console.error('❌ Erro ao iniciar compartilhamento:', err);
                    this.showStatus('Erro: ' + err.message, 'error', true);
                }
            }

            async stopSharing() {
                this.isSharing = false;
                if (this.screenStream) {
                    this.screenStream.getTracks().forEach(track => track.stop());
                    this.screenStream = null;
                }
                if (this.peerConnection) {
                    this.peerConnection.close();
                    this.peerConnection = null;
                }
                document.getElementById('connectionSection').style.display = 'block';
                document.getElementById('shareSection').style.display = 'none';
                document.getElementById('viewSection').style.display = 'none';
            }

            showJoinSection() {
                document.getElementById('connectionSection').style.display = 'none';
                document.getElementById('shareSection').style.display = 'none';
                document.getElementById('viewSection').style.display = 'block';
            }

            cancelJoin() {
                document.getElementById('connectionSection').style.display = 'block';
                document.getElementById('viewSection').style.display = 'none';
                document.getElementById('connectionStatus').innerHTML = '';
            }

            async connectToShare() {
                const code = document.getElementById('joinCode').value.trim().toUpperCase();
                if (!code || code.length !== 8) {
                    this.showStatus('Digite um código válido (8 caracteres).', 'error', true);
                    return;
                }

                try {
                    this.showStatus('Conectando...', 'info', true);
                    const shareData = this.retrieveShareCode(code);
                    if (!shareData) {
                        this.showStatus('Código inválido ou expirado.', 'error', true);
                        return;
                    }
                    await this.setupWebRTC(false, shareData.offer);
                } catch (err) {
                    this.showStatus('Erro ao conectar: ' + err.message, 'error', true);
                }
            }

            async setupWebRTC(isOfferer, remoteOffer = null) {
                this.peerConnection = new RTCPeerConnection({ iceServers: this.iceServers });

                this.peerConnection.addEventListener('connectionstatechange', () => {
                    console.log('Conexão:', this.peerConnection.connectionState);
                    if (this.peerConnection.connectionState === 'connected') {
                        this.showStatus('✅ Conectado com sucesso!', 'success', true);
                    }
                });

                this.peerConnection.addEventListener('track', (event) => {
                    const remoteVideo = document.getElementById('remoteVideo');
                    remoteVideo.srcObject = event.streams[0];
                    document.querySelector('.video-container').classList.add('active');
                });

                if (isOfferer) {
                    if (this.screenStream) {
                        const videoTrack = this.screenStream.getVideoTracks()[0];
                        this.peerConnection.addTrack(videoTrack, this.screenStream);
                    }
                    const offer = await this.peerConnection.createOffer();
                    await this.peerConnection.setLocalDescription(offer);
                    this.storeOfferForCode(this.shareCode, offer);
                } else {
                    await this.peerConnection.setRemoteDescription(new RTCSessionDescription(remoteOffer));
                    const answer = await this.peerConnection.createAnswer();
                    await this.peerConnection.setLocalDescription(answer);
                }
            }

            generateQRCode(code) {
                const qrContainer = document.getElementById('qrContainer');
                qrContainer.innerHTML = '';
                
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(
                    `${window.location.href}?join=${code}`
                )}`;
                
                const img = document.createElement('img');
                img.src = qrUrl;
                img.alt = `QR Code para ${code}`;
                img.style.maxWidth = '200px';
                qrContainer.appendChild(img);
            }

            storeShareCode(code) {
                sessionStorage.setItem(`share_${code}`, JSON.stringify({
                    code: code,
                    timestamp: Date.now(),
                    offer: null
                }));
            }

            storeOfferForCode(code, offer) {
                const data = JSON.parse(sessionStorage.getItem(`share_${code}`) || '{}');
                data.offer = offer;
                sessionStorage.setItem(`share_${code}`, JSON.stringify(data));
            }

            retrieveShareCode(code) {
                const data = sessionStorage.getItem(`share_${code}`);
                if (!data) return null;
                const parsed = JSON.parse(data);
                if (Date.now() - parsed.timestamp > 5 * 60 * 1000) {
                    sessionStorage.removeItem(`share_${code}`);
                    return null;
                }
                return parsed;
            }

            copyShareCode() {
                if (!this.shareCode) return;
                navigator.clipboard.writeText(this.shareCode).then(() => {
                    const btn = document.getElementById('copyCodeBtn');
                    const originalText = btn.textContent;
                    btn.textContent = '✅ Copiado!';
                    setTimeout(() => btn.textContent = originalText, 2000);
                });
            }

            showStatus(message, type = 'info', show = false) {
                const status = document.getElementById('connectionStatus');
                status.textContent = message;
                status.className = `status ${type} ${show ? 'active' : ''}`;
            }

            checkUrlParams() {
                const params = new URLSearchParams(window.location.search);
                const joinCode = params.get('join');
                if (joinCode) {
                    document.getElementById('joinCode').value = joinCode;
                    this.showJoinSection();
                }
            }
        }

        function toggleStats() {
            const overlay = document.getElementById('statsOverlay');
            overlay.style.display = overlay.style.display === 'none' ? 'block' : 'none';
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.screenShare = new P2PScreenShare();
            if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                alert('Seu navegador não suporta WebRTC Screen Sharing. Use Chrome, Firefox ou Edge.');
            }
        });

        window.addEventListener('beforeunload', () => {
            if (window.screenShare) window.screenShare.stopSharing();
        });
    </script>
</body>
</html>
