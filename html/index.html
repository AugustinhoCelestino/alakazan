<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG Display System</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- SELEÇÃO INICIAL DE MODO -->
  <div id="mode-selector" class="mode-selector">
    <button class="btn" onclick="initMode('master')">Abrir Painel do Mestre</button>
    <button class="btn" onclick="openPlayerWindow()">Abrir Tela dos Jogadores</button>
  </div>

  <!-- TELA DO MESTRE -->
  <div id="master-view" class="view">
    <div id="master-panel">
      <header>
        <h2>🛡️ Painel do Mestre - Controle Visual</h2>
        <button class="btn" onclick="openPlayerWindow()">🖥️ Abrir Tela dos Jogadores em Nova Janela</button>
      </header>

      <div class="main-content">
        <!-- Entrada de Imagens -->
        <div class="card">
          <h3>1. Adicionar Imagens</h3>
          
          <div class="input-group">
            <input type="text" id="img-url-input" placeholder="Cole a URL da imagem aqui...">
            <button class="btn" onclick="loadFromUrl()">Carregar</button>
          </div>

          <div style="text-align: center; color: #888;">ou</div>

          <input type="file" id="img-file-input" accept="image/*" multiple onchange="loadFromFile(event)">
          
          <!-- Galeria de Imagens Carregadas -->
          <div id="images-gallery" class="images-gallery" style="display:none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
              <h4 style="margin: 0;">Imagens Carregadas: <span id="images-count">0</span></h4>
              <span id="current-image-info" style="font-size: 12px; color: #aaa;"></span>
            </div>
            <div id="gallery-list" class="gallery-list"></div>
          </div>
        </div>

        <!-- Gerenciamento de Jogadores -->
        <div class="card">
          <h3>2. Jogadores</h3>
          
          <div class="input-group">
            <input type="text" id="player-name-input" placeholder="Nome do jogador...">
            <button class="btn" onclick="addPlayerUI()">➕ Adicionar</button>
          </div>

          <div style="text-align: center; color: #888; margin: 10px 0;">ou escolha imagem</div>

          <input type="file" id="player-image-input" accept="image/*" onchange="addPlayerWithImage(event)">
          
          <!-- Lista de Jogadores -->
          <div id="players-list" class="players-list" style="display:none;">
            <h4 style="margin-bottom: 10px;">Jogadores: <span id="players-count">0</span></h4>
            <div id="players-container"></div>
          </div>

          <div id="no-players-msg" style="text-align: center; color: #888; margin-top: 10px;">Nenhum jogador adicionado</div>
        </div>

        <!-- Pré-visualização e Ações -->
        <div class="card">
          <h3>3. Pré-visualização & Controle</h3>
          
          <div class="preview-box">
            <img id="master-preview" src="" alt="Nenhuma imagem selecionada" style="display:none;">
            <span id="preview-placeholder">Nenhuma imagem carregada</span>
          </div>

          <div class="controls-grid">
            <button class="btn" onclick="selectImage(Math.max(0, currentImageIndex - 1))" id="btn-prev">⬅️ Anterior</button>
            <button class="btn" onclick="selectImage(Math.min(imagesList.length - 1, currentImageIndex + 1))" id="btn-next">Próxima ➡️</button>
            <button class="btn" onclick="sendToPlayers(true)">▶️ Exibir</button>
            <button class="btn btn-danger" onclick="toggleBlackout()">🕶️ Blackout</button>
          </div>
          <button class="btn btn-danger" onclick="clearDisplay()" style="width: 100%; margin-top: 10px;">❌ Limpar Tudo</button>
        </div>
      </div>
    </div>
  </div>

  <!-- TELA DOS JOGADORES -->
  <div id="player-view" class="view">
    <div id="player-content">
      <img id="player-image" src="" alt="">
    </div>
    <div id="players-footer">
      <div id="players-footer-list"></div>
    </div>
  </div>

  <script>
// Usando BroadcastChannel para sincronização em tempo real entre abas/janelas
var imagesList = [];  // Array para armazenar todas as imagens
var currentImageIndex = -1;  // Índice da imagem selecionada
var isBlackout = false;
var playersList = [];  // Array para armazenar jogadores

// Sistema de sincronização entre abas via HTTP API
function sendMessageToTab(messageData) {
  // Enviar para servidor via POST
  fetch('/api/message', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(messageData)
  }).catch(e => console.error('Erro ao enviar mensagem:', e));
}

// Polling para verificar novas mensagens do servidor
setInterval(async () => {
  try {
    const response = await fetch('/api/message');
    const data = await response.json();
    
    // Se houver dado, processar
    if (data && data.type) {
      handleMessage(data);
    }
  } catch (e) {
    console.error('Erro ao buscar mensagem:', e);
  }
}, 200); // Verificar a cada 200ms

function handleMessage(data) {
  const playerImg = document.getElementById('player-image');
  
  if (!playerImg) return;

  if (data.type === 'UPDATE_IMAGE') {
    console.log('Atualizando imagem');
    playerImg.src = data.src;
    if (!data.blackout) {
      playerImg.classList.add('visible');
    } else {
      playerImg.classList.remove('visible');
    }
  } else if (data.type === 'TOGGLE_BLACKOUT') {
    console.log('Toggle blackout:', data.blackout);
    if (data.blackout) {
      playerImg.classList.remove('visible');
    } else if (playerImg.src) {
      playerImg.classList.add('visible');
    }
  } else if (data.type === 'CLEAR') {
    console.log('Limpando tela');
    playerImg.classList.remove('visible');
    setTimeout(() => { playerImg.src = ''; }, 500);
  } else if (data.type === 'SYNC_PLAYERS') {
    console.log('Sincronizando jogadores:', data.players);
    if (data.players) {
      playersList = data.players;
      renderPlayersFooter(data.players);
    }
  } else if (data.type === 'REQUEST_STATE') {
    console.log('REQUEST_STATE recebido');
    // Envia o estado atual quando um novo jogador se conecta
    if (currentImageIndex >= 0 && currentImageIndex < imagesList.length) {
      sendToPlayers(!isBlackout);
    }
    // Também sincroniza os jogadores
    if (playersList.length > 0) {
      sendMessageToTab({
        type: 'SYNC_PLAYERS',
        players: playersList
      });
    }
  }
}

function initMode(mode) {
  document.getElementById('mode-selector').style.display = 'none';
  if (mode === 'master') {
    document.getElementById('master-view').classList.add('active-view');
  } else {
    document.getElementById('player-view').classList.add('active-view');
    // Pedir atualização ao abrir
    sendMessageToTab({ type: 'REQUEST_STATE' });
  }
}

function openPlayerWindow() {
  window.open(window.location.href + '?mode=player', '_blank');
}

// Auto-detecta parâmetro de URL ?mode=player
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('mode') === 'player') {
  initMode('player');
}

/* --- LÓGICA DO MESTRE --- */
function loadFromUrl() {
  const url = document.getElementById('img-url-input').value.trim();
  if (url) {
    addImageToGallery(url);
    document.getElementById('img-url-input').value = '';
  }
}

function loadFromFile(event) {
  const files = event.target.files;
  if (files && files.length > 0) {
    let filesProcessed = 0;
    
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const reader = new FileReader();
      reader.onload = function(e) {
        addImageToGallery(e.target.result);
        filesProcessed++;
        if (filesProcessed === files.length) {
          event.target.value = ''; // Limpar o input
        }
      };
      reader.readAsDataURL(file);
    }
  }
}

function addImageToGallery(src) {
  imagesList.push(src);
  renderGallery();
  
  // Selecionar automaticamente a primeira imagem adicionada
  if (imagesList.length === 1) {
    selectImage(0);
  }
}

function selectImage(index) {
  if (index >= 0 && index < imagesList.length) {
    currentImageIndex = index;
    updatePreview();
    renderGallery();
  }
}

function removeImage(index) {
  imagesList.splice(index, 1);
  
  if (currentImageIndex === index) {
    // Se removeu a imagem selecionada, seleciona a próxima ou anterior
    if (imagesList.length > 0) {
      currentImageIndex = Math.min(index, imagesList.length - 1);
      updatePreview();
    } else {
      currentImageIndex = -1;
      clearPreview();
    }
  } else if (currentImageIndex > index) {
    currentImageIndex--;
  }
  
  renderGallery();
}

function renderGallery() {
  const galleryDiv = document.getElementById('images-gallery');
  const galleryList = document.getElementById('gallery-list');
  
  if (imagesList.length === 0) {
    galleryDiv.style.display = 'none';
    galleryList.innerHTML = '';
    updateNavigationButtons();
    return;
  }
  
  galleryDiv.style.display = 'block';
  galleryList.innerHTML = imagesList.map((img, index) => `
    <div class="gallery-item ${index === currentImageIndex ? 'active' : ''}" onclick="selectImage(${index})">
      <img src="${img}" alt="Imagem ${index + 1}">
      <button class="gallery-item-delete" onclick="event.stopPropagation(); removeImage(${index})">✕</button>
    </div>
  `).join('');
  
  updateNavigationButtons();
}

function updateNavigationButtons() {
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');
  const imagesCount = document.getElementById('images-count');
  const currentImageInfo = document.getElementById('current-image-info');
  
  if (btnPrev) btnPrev.disabled = currentImageIndex <= 0;
  if (btnNext) btnNext.disabled = currentImageIndex >= imagesList.length - 1;
  
  if (imagesCount) imagesCount.textContent = imagesList.length;
  if (currentImageInfo) {
    if (imagesList.length > 0 && currentImageIndex >= 0) {
      currentImageInfo.textContent = `${currentImageIndex + 1} de ${imagesList.length}`;
    } else {
      currentImageInfo.textContent = '';
    }
  }
}

function updatePreview() {
  if (currentImageIndex >= 0 && currentImageIndex < imagesList.length) {
    const previewImg = document.getElementById('master-preview');
    const placeholder = document.getElementById('preview-placeholder');
    
    previewImg.src = imagesList[currentImageIndex];
    previewImg.style.display = 'block';
    placeholder.style.display = 'none';
  }
}

function clearPreview() {
  const previewImg = document.getElementById('master-preview');
  const placeholder = document.getElementById('preview-placeholder');
  
  previewImg.style.display = 'none';
  placeholder.style.display = 'block';
}

function sendToPlayers(show = true) {
  if (currentImageIndex < 0 || currentImageIndex >= imagesList.length) return;
  isBlackout = !show;
  sendMessageToTab({
    type: 'UPDATE_IMAGE',
    src: imagesList[currentImageIndex],
    blackout: isBlackout
  });
}

function toggleBlackout() {
  isBlackout = !isBlackout;
  sendMessageToTab({
    type: 'TOGGLE_BLACKOUT',
    blackout: isBlackout
  });
}

function clearDisplay() {
  imagesList = [];
  currentImageIndex = -1;
  isBlackout = false;
  clearPreview();
  renderGallery();
  sendMessageToTab({ type: 'CLEAR' });
}

/* --- GERENCIAMENTO DE JOGADORES --- */
function addPlayerUI() {
  const nameInput = document.getElementById('player-name-input');
  const name = nameInput.value.trim();
  
  if (name) {
    const player = {
      id: Date.now(),
      name: name,
      image: '' // Será adicionada com a imagem de arquivo
    };
    playersList.push(player);
    nameInput.value = '';
    renderPlayersList();
    syncPlayers();
  }
}

function addPlayerWithImage(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = function(e) {
    const nameInput = document.getElementById('player-name-input');
    const name = nameInput.value.trim() || file.name.split('.')[0];
    
    const player = {
      id: Date.now(),
      name: name,
      image: e.target.result // Data URL da imagem
    };
    playersList.push(player);
    nameInput.value = '';
    document.getElementById('player-image-input').value = '';
    renderPlayersList();
    syncPlayers();
  };
  reader.readAsDataURL(file);
}

function removePlayer(playerId) {
  playersList = playersList.filter(p => p.id !== playerId);
  renderPlayersList();
  syncPlayers();
}

function renderPlayersList() {
  const container = document.getElementById('players-container');
  const listDiv = document.getElementById('players-list');
  const noPlayersMsg = document.getElementById('no-players-msg');
  const playersCount = document.getElementById('players-count');
  
  if (playersList.length === 0) {
    listDiv.style.display = 'none';
    noPlayersMsg.style.display = 'block';
    return;
  }
  
  listDiv.style.display = 'block';
  noPlayersMsg.style.display = 'none';
  playersCount.textContent = playersList.length;
  
  container.innerHTML = playersList.map(player => `
    <div class="player-item">
      ${player.image ? `<img class="player-item-avatar" src="${player.image}" alt="${player.name}">` : '<div class="player-item-avatar" style="background: #666;"></div>'}
      <span class="player-item-name">${player.name}</span>
      <button class="player-item-delete" onclick="removePlayer(${player.id})">✕</button>
    </div>
  `).join('');
}

function syncPlayers() {
  sendMessageToTab({
    type: 'SYNC_PLAYERS',
    players: playersList
  });
}

function renderPlayersFooter(players) {
  const footer = document.getElementById('players-footer-list');
  
  if (!players || players.length === 0) {
    footer.innerHTML = '';
    return;
  }
  
  footer.innerHTML = players.map(player => `
    <div class="footer-player">
      ${player.image ? `<img class="footer-player-avatar" src="${player.image}" alt="${player.name}">` : '<div class="footer-player-avatar" style="background: #666;"></div>'}
      <div class="footer-player-name">${player.name}</div>
    </div>
  `).join('');
}

  </script>
</body>
</html>
